# CSU demo bench: EPOS4 drives on CX-LAB01, commanded through the PLC motion
# server.
#
# plc_index is the GVL_Axes.Axis[] slot, where CSU-N sits at slot N+1. The NC
# axis number behind each slot (13 upward, offset by orphans from an earlier
# scan) is an XAE-side link that never appears here.
#
# Twelve of the twenty-four drives are cabled and scanned; append the rest as
# they are wired. Station addresses are unconfirmed on this bench, so CoE
# object reads stay unavailable until they are filled in.
name: csu-demo
backend: twincat

transport:
  host: 192.168.30.99
  ams_net_id: 5.57.12.96.1.1
  local_net_id: 192.168.30.220.1.1
  ams_port: 851

defaults:
  device: maxon_epos4
  pdo_profile: profile_position
  units:
    name: mm
  limits:
    velocity: 5.0

axes:
  - {name: CSU-0, plc_index: 1}
  - {name: CSU-1, plc_index: 2}
  - {name: CSU-2, plc_index: 3}
  - {name: CSU-3, plc_index: 4}
  - {name: CSU-4, plc_index: 5}
  - {name: CSU-5, plc_index: 6}
  - {name: CSU-6, plc_index: 7}
  - {name: CSU-7, plc_index: 8}
  - {name: CSU-8, plc_index: 9}
  - {name: CSU-9, plc_index: 10}
  - {name: CSU-10, plc_index: 11}
  - {name: CSU-11, plc_index: 12}
